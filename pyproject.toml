[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-mcp"
version = "0.1.0"
description = "MCP server exposing the Paperless-ngx REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0"]

[project.scripts]
paperless-mcp = "paperless_mcp.server:main"

[tool.setuptools.packages.find]
include = ["paperless_mcp*"]
